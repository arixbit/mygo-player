name: Build & Publish LGPL libmpv

on:
  workflow_dispatch:
    inputs:
      mpv_version:
        description: "Upstream mpv tag version without leading v (e.g. 0.40.0)"
        required: true
        default: "0.40.0"
      release_tag:
        description: "GitHub Release tag hosting the native library assets"
        required: true
        default: "native-mpv"
      targets:
        description: "Platforms to build"
        type: choice
        options:
          - all
          - macos
          - windows
        default: "all"
      publish_release:
        description: "Upload built libraries to GitHub Release and update mygo-plugin.json"
        type: boolean
        default: true
  push:
    tags:
      - "libmpv-v*"

permissions:
  contents: write

jobs:
  build-macos:
    if: github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            arch: arm64
            runner: macos-15
          - goarch: amd64
            arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build toolchain
        run: |
          brew install meson ninja pkg-config nasm autoconf automake libtool
          python3 -m pip install --user --break-system-packages jinja2

      - name: Build self-contained LGPL 2.1+ libmpv.dylib
        env:
          MPV_VERSION: ${{ github.event.inputs.mpv_version || '0.40.0' }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          chmod +x scripts/build-libmpv-macos.sh
          ./scripts/build-libmpv-macos.sh "${{ matrix.arch }}" "dist/libmpv-darwin-${{ matrix.goarch }}.dylib"

      - name: Install ffmpeg for Go integration test fixture
        run: brew install ffmpeg

      - name: Verify libmpv.dylib with zero-cgo Go integration tests
        env:
          CGO_ENABLED: "0"
          MYGO_REQUIRE_LIBMPV: "1"
          MYGO_NATIVE_MPV: ${{ github.workspace }}/dist/libmpv-darwin-${{ matrix.goarch }}.dylib
        run: go test -v ./...

      - name: Upload built dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-darwin-${{ matrix.goarch }}
          path: dist/libmpv-darwin-${{ matrix.goarch }}.dylib
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSYS2 UCRT64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python-jinja
            make
            tar
            xz
            bzip2
            gzip
            curl
            git
            diffutils
            autoconf
            automake
            libtool
            patch

      - name: Build self-contained LGPL 2.1+ mpv-2.dll
        shell: msys2 {0}
        env:
          MPV_VERSION: ${{ github.event.inputs.mpv_version || '0.40.0' }}
        run: |
          chmod +x scripts/build-libmpv-windows.sh
          ./scripts/build-libmpv-windows.sh amd64 dist/mpv-2.dll

      - name: Install standalone ffmpeg for Go integration test fixture
        shell: pwsh
        run: choco install ffmpeg --no-progress

      - name: Verify mpv-2.dll with zero-cgo Go integration tests (clean Windows PATH)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          MYGO_REQUIRE_LIBMPV: "1"
          MYGO_NATIVE_MPV: ${{ github.workspace }}\dist\mpv-2.dll
        run: |
          # Ensure MSYS2 bin directories are NOT on PATH so loading mpv-2.dll
          # proves zero external MSYS2/MinGW runtime DLL dependencies.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'msys64' }) -join ';'
          go test -v ./...

      - name: Upload built DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-2-windows-amd64
          path: dist/mpv-2.dll
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.publish_release) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/download/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare SHA-256 assets and update mygo-plugin.json
        env:
          MPV_VERSION: ${{ github.event.inputs.mpv_version || '0.40.0' }}
        run: |
          ARGS=(
            -manifest mygo-plugin.json
            -source "https://github.com/mpv-player/mpv/releases/tag/v${MPV_VERSION}"
            -release "${{ steps.meta.outputs.url }}"
            -out dist/release
          )
          if [[ -f artifacts/libmpv-darwin-arm64.dylib ]]; then
            ARGS+=(-file "darwin-arm64=artifacts/libmpv-darwin-arm64.dylib")
          fi
          if [[ -f artifacts/libmpv-darwin-amd64.dylib ]]; then
            ARGS+=(-file "darwin-amd64=artifacts/libmpv-darwin-amd64.dylib")
          fi
          if [[ -f artifacts/mpv-2.dll ]]; then
            ARGS+=(-file "windows-amd64=artifacts/mpv-2.dll")
          fi
          go run ./scripts/update-manifest "${ARGS[@]}"
          cat mygo-plugin.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Self-contained macOS & Windows LGPL-2.1-or-later libmpv dynamic libraries built by GitHub Actions for github.com/arixbit/mygo-player." \
              --latest=false
          fi
          gh release upload "$TAG" dist/release/* --repo "${{ github.repository }}" --clobber

      - name: Upload updated mygo-plugin.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygo-plugin-manifest
          path: mygo-plugin.json
