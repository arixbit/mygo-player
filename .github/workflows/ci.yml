name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check build scripts syntax
        run: |
          bash -n scripts/build-libmpv-macos.sh
          bash -n scripts/build-libmpv-windows.sh
          bash -n scripts/build-libmpv-linux.sh

      - name: Vet and build (zero cgo)
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build ./...

      - name: Install ffmpeg for integration tests
        run: brew install ffmpeg

      - name: Run unit & macOS integration tests (zero cgo)
        env:
          CGO_ENABLED: "0"
          MYGO_REQUIRE_LIBMPV: "1"
        run: go test -v ./...

      - name: Verify cross-platform compilation (zero cgo)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=darwin GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=js GOARCH=wasm go vet ./...
          GOOS=js GOARCH=wasm go build ./...

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Vet and build (zero cgo)
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build ./...

      - name: Run unit & Linux integration tests (zero cgo)
        env:
          CGO_ENABLED: "0"
          MYGO_REQUIRE_LIBMPV: "1"
        run: go test -v ./...

  test-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: windows-latest
            ffmpeg_zip: ffmpeg-master-latest-win64-gpl.zip
          - goarch: arm64
            runner: windows-11-arm
            ffmpeg_zip: ffmpeg-master-latest-winarm64-gpl.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and build (zero cgo)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build ./...

      - name: Install ffmpeg for integration tests
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.ffmpeg_zip }}" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $bin = (Get-ChildItem -Path $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "ffmpeg.exe not found after extraction" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run unit & Windows integration tests (zero cgo)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          MYGO_REQUIRE_LIBMPV: "1"
        run: go test -v ./...
